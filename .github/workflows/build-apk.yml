name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install minimal SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor deps
        run: npm install

      - name: Sync Android platform (uses committed android/ project)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 发布到 GitHub Release（tag 固定为 latest，每次构建覆盖），得到固定下载链接
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest "$APK" \
            --title "宏芊紫验收APP（最新构建）" \
            --notes "推送/手动触发自动构建。启动预申请定位/相机权限，按功能提示权限；仅限APP内运行（浏览器拦截）；加载页显示「宏芊紫验收APP」。下载 app-debug.apk 直接安装。" \
            --prerelease

      - name: Write download link to summary
        run: |
          echo "## 📱 APK 下载链接（固定地址，每次构建自动更新）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "构建：${{ github.sha }} @ $(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
